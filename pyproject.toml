[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smartdialer"
version = "0.1.0"
description = "A PostgreSQL-backed SmartDialer prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["smartdialer", "smartdialer.providers", "smartdialer.migrations"]

[tool.setuptools.package-dir]
"smartdialer.migrations" = "sql"

[tool.setuptools.package-data]
"smartdialer.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
